name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # compose.yml declares required vars as ${VAR?Variable not set}, and .env
      # is gitignored, so every compose command fails on a fresh runner without
      # this. The example values are the local-dev defaults — fine for CI, which
      # only ever talks to throwaway containers.
      - name: Create .env for Docker Compose
        run: cp .env.example .env
      - run: docker compose down -v --remove-orphans
      # --wait blocks on the db healthcheck so the database below can be
      # created without racing Postgres startup.
      - run: docker compose up -d --wait db mailcatcher
      # scripts/tests-start.sh points the suite at "${POSTGRES_DB}_test", but
      # the container only ever creates POSTGRES_DB itself, and nothing else
      # created the test database — so the suite died with
      # `database "app_test" does not exist`. conftest runs the migrations, so
      # an empty database is all that is needed here. Derived from .env rather
      # than hardcoded so it tracks whatever POSTGRES_DB is set to.
      - name: Create the test database
        run: |
          set -a; . ./.env; set +a
          test_db="${POSTGRES_DB}_test"
          exists=$(docker compose exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT 1 FROM pg_database WHERE datname='${test_db}'")
          if [ "$exists" != "1" ]; then
            docker compose exec -T db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "CREATE DATABASE ${test_db}"
          fi
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
