labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Signal. Please include enough context for another maintainer to reproduce the question or setup issue.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include commands, logs, screenshots, or environment details if relevant.
    validations:
      required: false
