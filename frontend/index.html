<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Signal</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.png" />
    <style>
      /* Critical theme colors — prevents flash of wrong background before Tailwind CSS loads */
      html { background: oklch(1 0 0); color: oklch(0.145 0 0); }
      html.dark { background: oklch(0.18 0.014 62); color: oklch(0.925 0.018 78); }
    </style>
    <script>
      (() => {
        var saved, theme;
        try {
          saved = localStorage.getItem('vite-ui-theme');
          theme = saved || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
