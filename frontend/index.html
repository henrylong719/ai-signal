<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Signal — Track the AI updates that matter</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <meta
      name="description"
      content="Track AI updates that matter — labs, research papers, engineering blogs, and trusted builders. Curated for engineers, founders, and researchers."
    />
    <meta name="theme-color" content="#0F1418" />
    <link rel="canonical" href="https://aisignal.now/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Signal" />
    <meta property="og:url" content="https://aisignal.now/" />
    <meta
      property="og:title"
      content="AI Signal — Track the AI updates that matter"
    />
    <meta
      property="og:description"
      content="Follow important AI updates from labs, research papers, engineering blogs, and trusted builders in one focused reading experience."
    />
    <meta property="og:image" content="https://aisignal.now/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AI Signal — Track the AI updates that matter"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AI Signal — Track the AI updates that matter"
    />
    <meta
      name="twitter:description"
      content="Follow important AI updates from labs, research papers, engineering blogs, and trusted builders in one focused reading experience."
    />
    <meta name="twitter:image" content="https://aisignal.now/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="AI Signal — Track the AI updates that matter"
    />

    <!-- Structured data: site-wide WebSite + Organization. Tells search
         engines what AI Signal is and links the brand to the social
         account. Lives in index.html so it's picked up regardless of
         which SPA route is crawled. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://aisignal.now/#website",
            "url": "https://aisignal.now/",
            "name": "AI Signal",
            "description": "Track the AI updates that matter — labs, research papers, engineering blogs, and trusted builders in one focused reading experience.",
            "inLanguage": "en"
          },
          {
            "@type": "Organization",
            "@id": "https://aisignal.now/#organization",
            "name": "AI Signal",
            "url": "https://aisignal.now/",
            "logo": "https://aisignal.now/og-image.png"
          }
        ]
      }
    </script>

    <style>
      /* Critical theme colors — prevents flash of wrong background before Tailwind CSS loads */
      html {
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
      }
      html.dark {
        background: oklch(0.13 0.006 225);
        color: oklch(0.93 0.012 80);
      }
    </style>
    <script>
      (() => {
        var saved, theme;
        try {
          saved = localStorage.getItem('vite-ui-theme');
          theme = saved || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
