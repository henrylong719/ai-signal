[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "feedparser>=6.0.12",
    "pgvector>=0.3.0,<1.0.0",
    # sentence-transformers 3.x is happy with torch 2.2-2.4; 4.x bumps the
    # torch floor to ~2.5 which dropped Intel Mac wheels. Pinning to 3.x
    # keeps Intel Mac development working. Re-evaluate when Apple Silicon
    # is the only supported macOS, which it effectively is for new installs.
    "sentence-transformers>=3.0.0,<4.0.0",
    # torch 2.2.x is the last release with Intel Mac (x86_64) wheels.
    # Pinning here rather than letting sentence-transformers pull the
    # latest avoids the resolver picking a torch with no compatible
    # wheel. Linux and Apple Silicon wheels are still fine on 2.2.x.
    "torch>=2.2.0,<2.3.0",
]

# torch is pulled in transitively by sentence-transformers. The default
# install grabs the GPU-capable wheel (~2GB). For Docker images and CI,
# pinning to CPU-only wheels (https://download.pytorch.org/whl/cpu) cuts
# this to ~200MB. Configure via the `tool.uv.sources` table when you're
# ready to optimize image size — it's a deployment concern, not a code
# correctness one.

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true
