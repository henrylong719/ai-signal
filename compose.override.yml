services:

  # Local services are exposed on localhost ports for development.
  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "5432:5432"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      EMAILS_FROM_EMAIL: "noreply@example.com"
      # The Playwright suite signs in far more than the 10-per-minute
      # quota on /login/access-token, and every container shares one
      # source IP, so the limiter starts returning 429 mid-run and the
      # login helper hangs on waitForURL. The limiter's own behaviour is
      # covered by the backend tests, which flip this flag themselves.
      RATE_LIMIT_ENABLED: "false"

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        # Empty on purpose — see the environment block below.
        - VITE_API_URL=
        - NODE_ENV=production
    ipc: host
    depends_on:
      # service_healthy, not a bare dependency: a plain depends_on only waits
      # for the container to start, so the suite raced backend startup and
      # auth.setup timed out filling the login form against a backend that was
      # not serving yet.
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # The browser must reach the API on its *own* origin, otherwise the
      # auth cookies are set on host `backend` and the app running on
      # localhost:5173 cannot see them (cookies ignore ports, not hosts).
      # Empty base => relative /api/... requests => vite proxies them.
      - VITE_API_URL=
      - VITE_API_PROXY_TARGET=http://backend:8000
      # Node-side base, for test code that calls the API directly rather
      # than through the browser. That code is not subject to the cookie
      # rules above, so it addresses the backend container directly.
      - PLAYWRIGHT_API_URL=http://backend:8000
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
